name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17,47 * * * *' # tiap 30 menit: perbarui snapshot berita (cadangan bila VPS mati)

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Snapshot berita (cadangan bila VPS mati)
        run: node scripts/snapshot-berita.mjs
        continue-on-error: true
      - name: Snapshot profil tim (cadangan bila VPS mati)
        run: node scripts/snapshot-tim.mjs
        continue-on-error: true
      - name: Buat varian ukuran foto (HD tetap, HP memuat versi kecil)
        run: node scripts/optimasi-gambar.mjs
        continue-on-error: true
      - run: npm run build
        env:
          GITHUB_PAGES: 'true'
          NEXT_PUBLIC_BASE_PATH: ''
      - run: touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment2.outputs.page_url || steps.deployment3.outputs.page_url }}
    steps:
      # GitHub Pages kadang membalas 502 "Server Error" saat membuat deployment (2026-10-29, build sukses tapi tidak tayang sehingga
      # editor Kelola Website melapor "GAGAL dibangun ulang"). Gangguan sementara di sisi GitHub: dicoba sampai 3x dengan jeda.
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Jeda sebelum mencoba tayang lagi (percobaan 2)
        if: steps.deployment.outcome == 'failure'
        run: sleep 45
      - id: deployment2
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Jeda sebelum mencoba tayang lagi (percobaan 3)
        if: steps.deployment.outcome == 'failure' && steps.deployment2.outcome == 'failure'
        run: sleep 90
      - id: deployment3
        if: steps.deployment.outcome == 'failure' && steps.deployment2.outcome == 'failure'
        uses: actions/deploy-pages@v4
